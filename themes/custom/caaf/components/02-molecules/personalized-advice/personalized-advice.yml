title: "Recibe asesoría personalizada"
description: "Déjanos tus datos y uno de nuestros asesores se pondrá en contacto contigo para brindarte la mejor solución según tus necesidades."
form_action: "#"
form_method: "post"
validation:
  required: "Este campo es obligatorio."
  email: "Ingresa un correo válido."
  select: "Selecciona una opción."
  terms: "Debes aceptar los términos y condiciones."
conditional:
  source: "consultation_type"
  trigger_option_id: "registro"
  notification_recipient_name: "notification_recipient"
  editor_note: "Para activar los campos condicionales, la opción Registro del Tipo de consulta debe conservar option_id: registro."
success_modal:
  modal_id: "personalized-advice-success"
  title: "¡Formulario enviado con éxito!"
  text: "Hemos recibido tu información correctamente. Pronto uno de nuestros asesores se pondrá en contacto contigo."
  icon_src: "https://i.postimg.cc/L82WXvTM/Vector.png"
  is_open: false
  close_button:
    label: "Cerrar modal"
  primary_button:
    text: ""
    url: "#"
  secondary_button:
    text: ""
    url: "#"
background:
  mobile: "/personalized-advice-bg.jpg"
  desktop: "/personalized-advice-bg.jpg"
fields:
  - id: "advice-name"
    name: "name"
    type: "text"
    icon: "user"
    label: "Nombres completos"
    placeholder: "Juan Pérez"
    required: true
    autocomplete: "name"
    minlength: 2
    maxlength: 80
    minlength_message: "Escribe mínimo 2 caracteres."
  - id: "advice-email"
    name: "email"
    type: "email"
    icon: "mail"
    label: "Usuario / Email"
    placeholder: "correo@ejemplo.com"
    required: true
    autocomplete: "email"
    maxlength: 120
  - id: "advice-phone"
    name: "phone"
    type: "phone"
    icon: "phone"
    label: "Número de contacto"
    placeholder: "3001234567"
    required: true
    autocomplete: "tel-national"
    inputmode: "numeric"
    pattern: "[0-9]{7,15}"
    minlength: 7
    maxlength: 15
    validation_message: "Solo puedes escribir números, sin espacios ni símbolos."
    minlength_message: "Escribe mínimo 7 números."
    prefix_options:
      - value: "+57"
        label: "+57"
  - id: "advice-company"
    name: "company"
    type: "text"
    icon: "company"
    icon_src: "/advice-company.svg"
    label: "Nombre de la empresa"
    placeholder: "Esinergia"
    required: true
    autocomplete: "organization"
    minlength: 2
    maxlength: 100
    minlength_message: "Escribe mínimo 2 caracteres."
  - id: "advice-type"
    name: "consultation_type"
    type: "select"
    icon: "search"
    icon_src: "/advice-consultation.svg"
    label: "Tipo de consulta"
    placeholder: "Seleccione una opcion"
    required: true
    options:
      - value: "turismo"
        label: "Turismo"
      - value: "exportaciones"
        label: "Exportaciones"
      - value: "inversion"
        label: "Inversión"
      - value: "registro"
        label: "Solicitud creación usuario Gubernamental"
        option_id: "registro"
  - id: "advice-document-number"
    name: "document_number"
    type: "document"
    icon: "message"
    label: "Tipo de documento + Número"
    placeholder: "Ingresa el número"
    required: true
    conditional_group: "registro"
    minlength: 5
    maxlength: 20
    pattern: "[A-Za-z0-9-]{5,20}"
    validation_message: "Usa entre 5 y 20 caracteres, solo letras, números o guion."
    minlength_message: "Escribe mínimo 5 caracteres."
    prefix_name: "document_type"
    prefix_label: "Tipo de documento"
    prefix_options:
      - value: "CC"
        label: "CC"
      - value: "CE"
        label: "CE"
      - value: "PP"
        label: "PP"
      - value: "NIT"
        label: "NIT"
  - id: "advice-role"
    name: "role"
    type: "text"
    icon: "company"
    label: "Cargo / Función"
    placeholder: "Ej. Coordinador"
    required: true
    conditional_group: "registro"
    minlength: 2
    maxlength: 100
    minlength_message: "Escribe mínimo 2 caracteres."
  - id: "advice-department"
    name: "department"
    type: "text"
    icon: "company"
    label: "Área / Departamento"
    placeholder: "Ej. Planeación"
    required: true
    conditional_group: "registro"
    minlength: 2
    maxlength: 100
    minlength_message: "Escribe mínimo 2 caracteres."
  - id: "advice-country"
    name: "country"
    type: "text"
    icon: "search"
    label: "País"
    placeholder: "Ej. Colombia"
    required: true
    conditional_group: "registro"
    minlength: 2
    maxlength: 80
    minlength_message: "Escribe mínimo 2 caracteres."
  - id: "advice-city"
    name: "city"
    type: "text"
    icon: "search"
    label: "Ciudad"
    placeholder: "Ej. Bogotá"
    required: true
    conditional_group: "registro"
    minlength: 2
    maxlength: 80
    minlength_message: "Escribe mínimo 2 caracteres."
  - id: "advice-procolombia-axis"
    name: "procolombia_axis"
    type: "select"
    icon: "search"
    label: "Eje ProColombia"
    placeholder: "Seleccione un eje"
    required: true
    options:
      - value: "turismo"
        label: "Turismo"
        notification_email: "turismo@example.com"
      - value: "exportaciones"
        label: "Exportaciones"
        notification_email: "exportaciones@example.com"
      - value: "inversion"
        label: "Inversión"
        notification_email: "inversion@example.com"
      - value: "marca-pais"
        label: "Marca País"
        notification_email: "marca-pais@example.com"
  - id: "advice-justification"
    name: "justification"
    type: "textarea"
    icon: "message"
    label: "Justificación"
    placeholder: "Explica brevemente la solicitud"
    required: true
    conditional_group: "registro"
    minlength: 10
    maxlength: 500
    minlength_message: "Escribe mínimo 10 caracteres."
  - id: "advice-message"
    name: "message"
    type: "textarea"
    icon: "message"
    icon_src: "/advice-message.svg"
    label: "Mensaje"
    placeholder: "Cuéntanos en qué podemos ayudarte"
    required: true
    minlength: 10
    maxlength: 500
    minlength_message: "Escribe mínimo 10 caracteres."
terms:
  name: "terms"
  text: "Acepto"
  link_text: "términos y condiciones"
  url: "#"
  required: true
submit_label: "Enviar"
