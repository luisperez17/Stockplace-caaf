eyebrow: "Sobre nosotros"
title: "Acerca de ProColombia StockPlace"
body: |
  <p>StockPlace es una plataforma de contenido premium de Colombia, creada para apoyar la promoción internacional del país. Está dirigida a entidades gubernamentales aliadas a ProColombia ofreciéndoles contenido que resalta la riqueza cultural, natural y económica de la nación.</p>
  <p>A través de StockPlace, los usuarios pueden encontrar material audiovisual que conecta sus proyectos con la Marca País, las exportaciones, el turismo internacional y la inversión extranjera en Colombia.</p>
